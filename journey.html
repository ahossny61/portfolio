<!doctype html>
<html lang="en">
  <!--
  ============================================================
  AHMED HOSNY - JOURNEY WORLD   (single file: HTML + CSS + JavaScript)
  ============================================================
  External libraries (only two):
    - three.js r128   https://threejs.org   (3D engine, loaded from cdnjs)
    - Nunito          Google Fonts          (text font)

  HOW THE FILE IS ORGANIZED (search for these banners in the script)
    1. CONTENT      -> STOPS: every place, its dates, texts and position.  EDIT HERE FIRST.
    2. UI           -> panel, timeline bar, 2D map, classic page (all built from STOPS automatically).
    3. 3D WORLD     -> scene, ground, trees, builders (buildings), people, signs, player, camera.

  ADD A NEW PLACE IN 4 STEPS
    1. Copy one object inside STOPS and change: id, name, short (label in the bottom bar),
       date, title, org, pos:[x, z] (z goes more negative as you go further along the path),
       and html (the text shown in the card).
    2. Optional boards: add  signs:[[title,[line,line,line],0xRRGGBB],[...]]  to that object.
       Without it, the place gets a simple house (builders.generic) and no boards.
    3. Optional own building: write  builders.yourid = function(g){ ... }  (copy builders.uni
       as a start) and people with  decor.yourid = function(g){ person(g,{...}); }.
    4. Save and reload. The bottom bar, the 2D map and the classic page update by themselves.

  TIPS
    - Colors are hex numbers: 0xe08a5b.   Units are meters-like; a person is about 2.5 tall.
    - person(g,{x,z,c:shirtColor,acc:'glasses'|'cap'|'helmet'|'headset'|'tie'|'clip'|'laptop',
                wave:true | talk:true | sit:true | walk:[x1,z1,x2,z2]})
    - Keep a place at least 30 units away from its neighbours so the buildings do not overlap.
-->
  <head>

    <div id="sky"></div>

    </div>

      ><button type="button" data-v="map">Journey map</button
      ><button type="button" data-v="classic">Classic page</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      /* ============================================================
   1. CONTENT: edit your journey here
   ============================================================ */
      var STOPS = [
        {
          id: "uni",
          name: "Assiut University",
          short: "09/16",
          date: "Sep 2016 – Jun 2020",
          title: "B.Sc. in Computer Science",
          org: "Faculty of Computers and Information, Assiut University",
          pos: [0, -12],
          html:
            '<div class="stat"><div><b>3.15</b><span>GPA, Very Good</span></div><div><b>10th</b><span>of 50 teams, 2018</span></div><div><b>2</b><span>graduation projects</span></div></div>' +
            "<h3>What I did</h3><ul><li>Studied algorithms, advanced databases, machine learning, neural networks, embedded systems, graphics, C#, C++ and .NET.</li><li>Placed 10th out of 50 teams in the Upper Egypt (El-Saeedi) programming contest in 2018, and kept solving problems on Codeforces and HackerRank.</li></ul>" +
            '<h3>Graduation projects</h3><details class="sub" open><summary>Search inside videos</summary><div><p>Search a video collection by text or image and get the matching video and the exact moment. Built entirely in Python with an SQL database. I was analyst, developer, tester, and leader of the team.</p></div></details><details class="sub"><summary>Exam grading app</summary><div><p>An Android app photographs multiple-choice answer sheets and a Python service grades them and returns the score and the right and wrong answers. I was analyst, developer, and team leader.</p></div></details>' +
            "<h3>Then</h3><p>One year of mandatory military service before my first job, in July 2021.</p>",
        },
        {
          id: "dig",
          name: "Digination",
          short: "07/21",
          date: "Jul 2021 – Aug 2024",
          title: "Software Developer, then Senior OutSystems Developer",
          org: "Digination · promoted to Senior in Jul 2023",
          pos: [30, -52],
          html:
            "<h3>First 18 months: KSMC, two worlds at once</h3><ul><li>Delivered full stories from front end to back end with ABP Framework on .NET, and built OutSystems solutions in parallel.</li><li>Built <b>Central Admin</b> in ABP (roles, permissions, users, configuration) and the <b>CRM</b> in OutSystems on the Case Management Framework for King Saud Medical City, integrated with each other.</li></ul>" +
            "<h3>As a Senior</h3><ul><li>Taught and monitored new developers and assigned their tasks. Several of them now run large projects and still thank me.</li><li>Agile on Azure Boards: planning, retrospectives, client reviews, releases, change requests. Git merging in OutSystems.</li><li>Automated solution creation and broken-dependency checks with the LifeTime API and Python.</li><li>Published a Forge component for client-side form validation.</li></ul>" +
            '<h3>On-site projects</h3><details class="sub" open><summary>SCISP · 10 months</summary><div><p>Strategic Partnerships. The right hand of the team lead: complex stories, on-site contact for the client, and covering the team lead role when he was away.</p></div></details><details class="sub"><summary>MOT · 3 months</summary><div><p>Joined an existing project with a full team as a senior and finished stories at the highest quality.</p></div></details><details class="sub"><summary>SEC · 3 months</summary><div><p>Sole developer and tester, also gathering and analyzing requirements with the project manager. Built an OnBase integration as a .NET extension; the SDK was there but unclear.</p></div></details><details class="sub"><summary>Military Industries · 2 months</summary><div><p>A second OnBase project. Under the team lead’s direction I ran a large data migration with Hangfire, a .NET library for background jobs. I also connected the website to OnBase for file management, added watermarking, and organized the files.</p></div></details>',
        },
        {
          id: "ops",
          name: "Operations",
          short: "08/24",
          date: "Aug 2024 – Aug 2025",
          title: "Senior OutSystems Developer, Operations",
          org: "Sure, outsourced to Infath (Assignment and Liquidation Center)",
          pos: [-22, -96],
          html:

                b[0] + Math.sin(t * 0.5 + b[3]) * 2,
                b[1] + Math.sin(t * 0.9 + b[3]) * 0.8,
                b[2] + Math.cos(t * 0.4 + b[3]) * 2,
              );
            }
            fa.needsUpdate = true;
          }
          /* labels */
          var W = innerWidth,
            H = innerHeight;
          function place(el, pos, lift, show) {
            vp.set(pos.x, lift, pos.z).project(camera);
            if (vp.z > 1) {
              el.style.opacity = 0;
              return;
            }
            el.style.left = ((vp.x + 1) / 2) * W + "px";
            el.style.top = ((1 - vp.y) / 2) * H + "px";
            el.style.opacity = show;
          }
          stationObjs.forEach(function (o, i) {
            if (!o.label) return;
            var d = Math.hypot(player.position.x - o.pos.x, player.position.z - o.pos.z);
            place(o.label, o.pos, i === undefined ? 0 : o.g ? 15 : 5, d < 95 ? 1 : 0);
          });
          place(nameTag, player.position, 4.2, 1);
          renderer.render(scene, camera);
        }
        promptEl.style.pointerEvents = "auto";
        promptEl.onclick = function () {
          if (near >= 0) openStop(near);
        };
        $("#loading").style.opacity = 0;
        setTimeout(function () {
          $("#loading").style.display = "none";
        }, 700);
        frame();
      })();
    </script>
  </body>
</html>
